name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: example-anon-key
      FIREBASE_API_KEY: example-api-key
      FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      FIREBASE_PROJECT_ID: example
      FIREBASE_STORAGE_BUCKET: example.appspot.com
      FIREBASE_MESSAGING_SENDER_ID: "123456"
      FIREBASE_APP_ID: 1:123456:web:example
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests unitarios
        run: npm test

      - name: Crear build de producción
        run: npm run build

      - name: Generar documentación
        run: npm run docs
