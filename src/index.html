<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8"/>
  <title>Vértice Games</title>
  <meta name="description" content="Gestión accesible de un catálogo de videojuegos."/>
  <meta name="theme-color" content="#0057b8"/>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <script>
    // Aplica el tema guardado antes de pintar la página para evitar un destello.
    (function () {
      try {
        var guardado = localStorage.getItem('tema');
        var oscuro = guardado ? guardado === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('ion-palette-dark', oscuro);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>

  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Vértice Games"/>
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
