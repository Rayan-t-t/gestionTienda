<ion-menu contentId="main-content" menuId="menu-principal">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Gestión de videojuegos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      @if (estaAutenticado()) {
        <ion-item routerLink="/videojuegos" routerDirection="root">
          <ion-icon slot="start" name="game-controller" aria-hidden="true"></ion-icon>
          <ion-label>Videojuegos</ion-label>
        </ion-item>
        <ion-item routerLink="/acerca" routerDirection="root">
          <ion-icon slot="start" name="information-circle" aria-hidden="true"></ion-icon>
          <ion-label>Acerca de</ion-label>
        </ion-item>
        <ion-item routerLink="/ayuda" routerDirection="root">
          <ion-icon slot="start" name="help-circle" aria-hidden="true"></ion-icon>
          <ion-label>Ayuda</ion-label>
        </ion-item>
        @if (esAdmin()) {
          <ion-item routerLink="/dashboard" routerDirection="root">
            <ion-icon slot="start" name="speedometer" aria-hidden="true"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        }
        <ion-item button (click)="cerrarSesion()" aria-label="Cerrar sesión">
          <ion-icon slot="start" name="log-out" aria-hidden="true"></ion-icon>
          <ion-label>Cerrar sesión</ion-label>
        </ion-item>
      } @else {
        <ion-item routerLink="/login" routerDirection="root">
          <ion-icon slot="start" name="log-in" aria-hidden="true"></ion-icon>
          <ion-label>Iniciar sesión</ion-label>
        </ion-item>
        <ion-item routerLink="/ayuda" routerDirection="root">
          <ion-icon slot="start" name="help-circle" aria-hidden="true"></ion-icon>
          <ion-label>Ayuda</ion-label>
        </ion-item>
      }
    </ion-list>
  </ion-content>
</ion-menu>
