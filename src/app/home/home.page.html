<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Inicio</ion-title>
    <app-control-sesion slot="end" />
  </ion-toolbar>
  <app-navegacion-principal />
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" role="region" aria-label="Inicio">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="inicio">
    <h1>Gestor de Videojuegos</h1>
    <p>Aplicación para gestionar el catálogo de videojuegos</p>
    <ion-button routerLink="/videojuegos" class="ion-margin-top">
      Ver Catálogo
    </ion-button>
  </div>
</ion-content>
