<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dashboard</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Estadísticas de Actividades</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <canvas id="graficoActividades" aria-label="Gráfico de actividades" role="img"></canvas>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Historial de Actividades</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      @if (cargando()) {
        <div class="ion-text-center">
          <ion-spinner name="crescent" aria-label="Cargando actividades"></ion-spinner>
        </div>
      } @else {
        <ion-list>
          @for (actividad of actividades(); track $index) {
            <ion-item>
              <ion-label>
                <h2>{{ actividad.tipo | uppercase }}</h2>
                <p>{{ actividad.descripcion }}</p>
                @if (actividad.usuario) {
                  <p><small>Usuario: {{ actividad.usuario }}</small></p>
                }
              </ion-label>
            </ion-item>
          }
        </ion-list>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
